#
# gwaf is security infrastructure, so the gates here are blocking rather than
# advisory. In particular the SLO tests in bench_test.go run as ordinary tests:
# a claim that is only checked when someone remembers to look at benchmark
# output is not a guarantee.

name: CI

# Every branch, not just main.
#
# The gates below had never run once. The repository was created on 2026-08-06,
# ten jobs were defined, and the API reported zero workflow runs — because all
# the work happens on feature branches and this only fired on main. A gate that
# runs after the branch is merged is a gate that reports on work already shipped,
# which is the same failure as a check that skips when its tool is missing
# (CLAUDE.md §6): a green tick nobody earned.
#
# workflow_dispatch is here so a human can prove CI still works without inventing
# a commit to do it with.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.26.5'

jobs:
  build:
    name: build & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: gofmt
        run: |
          out=$(gofmt -s -l .)
          if [ -n "$out" ]; then echo "unformatted files:"; echo "$out"; exit 1; fi
      - run: go build ./...
      - run: go vet ./...

  # The core module must stay free of third-party dependencies. Everything an
  # embedder inherits from gwaf is a supply-chain liability they did not choose.
  deps:
    name: zero dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make deps

  test:
    name: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test ./...

  race:
    name: race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test -race ./...

  lint:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: staticcheck ./...

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  # Parsers and canonicalization take attacker input directly, so every one has
  # a fuzz target and every PR gets a short run. The nightly job below goes deep.
  fuzz-smoke:
    name: fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make fuzz FUZZTIME=30s   # includes the Inert-claim harness

  # The evasion corpus is the primary security metric, and the benign corpus is
  # reported beside it. Detection rate alone is never a passing signal: a rule
  # that blocks everything scores 100% on recall and gets the firewall disabled.
  corpus:
    name: evasion & false-positive corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test -run 'TestEvasionCorpus|TestBenignCorpus|TestInterpretation|TestVerbatim' -v .

  # Confidence is measured, not declared (docs/CONCEPT.md §8). A rule claiming
  # more precision than the corpus supports fails the build here rather than
  # surfacing as a support ticket about blocked legitimate traffic.
  calibrate:
    name: confidence calibration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go run ./cmd/gwaf calibrate
      - run: go run ./cmd/gwaf lint
      # Selectivity is measured, not gated. A literal that admits most benign
      # traffic is usually the cost of tolerant matching rather than a mistake
      # (.serena/memories/rejected_literal_hints.md), so this reports and a human
      # reads it. Gating it would invite exactly the "tightening" that is a
      # bypass.
      - run: go run ./cmd/gwaf lint -corpus testdata/corpus/benign.jsonl

  # The SLOs in CLAUDE.md §2 — zero allocations, zero rules evaluated on benign
  # traffic, sub-linear ruleset scaling, bounded fuel — are asserted as tests so
  # a regression fails the build rather than going unnoticed.
  slo:
    name: performance SLOs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test -run 'TestSLO' -v .
      - name: benchmark smoke run
        run: go test -run=XXX -bench=. -benchmem -benchtime=10000x ./...

  # A linux/amd64 run, because every number gwaf publishes was taken on one
  # laptop (docs/BENCHMARKS.md §5 says so).
  #
  # Deliberately *not* a gate, and deliberately not run with
  # GWAF_LATENCY_STRICT. A GitHub-hosted runner is shared, virtualised and
  # noisy; a p50 asserted there would fail for reasons that have nothing to do
  # with this repository, and a gate that flaps is a gate people learn to
  # re-run until it passes. What it produces is a second architecture's numbers
  # with their provenance attached, which is what "reproducible benchmarks"
  # requires and what publishing one machine's figures cannot give.
  bench-linux:
    name: benchmarks (linux/amd64, indicative)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: provenance
        run: |
          echo "commit:  ${{ github.sha }}"
          echo "runner:  ${{ runner.os }} ${{ runner.arch }} (GitHub-hosted, shared)"
          go version
          echo "cpu:     $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs)"
          echo "cores:   $(nproc)"
          echo "mem:     $(free -h | awk '/^Mem:/{print $2}')"
      - name: latency distribution
        run: go test -run 'TestLatencyDistribution|TestSLO' -v . 2>&1 | tee latency-linux-amd64.txt
      - name: benchmark suite
        run: go test -run=XXX -bench=. -benchmem -count=6 ./... 2>&1 | tee bench-linux-amd64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench-linux-amd64
          path: |
            bench-linux-amd64.txt
            latency-linux-amd64.txt

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test -coverprofile=coverage.out -coverpkg=./... ./...
      - run: go tool cover -func=coverage.out | tail -1
