#
# gwaf is security infrastructure, so the gates here are blocking rather than
# advisory. In particular the SLO tests in bench_test.go run as ordinary tests:
# a claim that is only checked when someone remembers to look at benchmark
# output is not a guarantee.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: '1.26.5'

jobs:
  build:
    name: build & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: gofmt
        run: |
          out=$(gofmt -s -l .)
          if [ -n "$out" ]; then echo "unformatted files:"; echo "$out"; exit 1; fi
      - run: go build ./...
      - run: go vet ./...

  # The core module must stay free of third-party dependencies. Everything an
  # embedder inherits from gwaf is a supply-chain liability they did not choose.
  deps:
    name: zero dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make deps

  test:
    name: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test ./...

  race:
    name: race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test -race ./...

  lint:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: staticcheck ./...

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  # Parsers and canonicalization take attacker input directly, so every one has
  # a fuzz target and every PR gets a short run. The nightly job below goes deep.
  fuzz-smoke:
    name: fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make fuzz FUZZTIME=30s   # includes the Inert-claim harness

  # The evasion corpus is the primary security metric, and the benign corpus is
  # reported beside it. Detection rate alone is never a passing signal: a rule
  # that blocks everything scores 100% on recall and gets the firewall disabled.
  corpus:
    name: evasion & false-positive corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test -run 'TestEvasionCorpus|TestBenignCorpus|TestInterpretation|TestVerbatim' -v .

  # The SLOs in CLAUDE.md §2 — zero allocations, zero rules evaluated on benign
  # traffic, sub-linear ruleset scaling, bounded fuel — are asserted as tests so
  # a regression fails the build rather than going unnoticed.
  slo:
    name: performance SLOs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test -run 'TestSLO' -v .
      - name: benchmark smoke run
        run: go test -run=XXX -bench=. -benchmem -benchtime=10000x ./...

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test -coverprofile=coverage.out -coverpkg=./... ./...
      - run: go tool cover -func=coverage.out | tail -1
